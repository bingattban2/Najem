name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Debug APK + JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install platform packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate Gradle wrapper
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
      - name: Assemble and run local unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: najimwifi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: najimwifi-jvm-test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore

  android-instrumentation:
    name: Android emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Android instrumentation on clean emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: najimwifi-android-test-results
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: ignore
