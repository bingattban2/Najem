name: Android signed release

# Owner-initiated only: never expose signing secrets to pull requests.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: najim-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    name: Verify, build and sign APK
    runs-on: ubuntu-latest
    timeout-minutes: 105
    # Configure required reviewers for this environment in GitHub Settings.
    environment: release
    steps:
      - name: Checkout the exact selected commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Verify Gradle wrapper is present
        shell: bash
        run: |
          set -euo pipefail
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Build debug APK and run local JVM tests
        shell: bash
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest

      # Release acceptance: UI/Room/SQLCipher device tests must pass before
      # signing. Tests run without production Google credentials or client data.
      - name: Run Android integration tests before signing
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Require all owner-managed signing secrets
        shell: bash
        env:
          STORE_B64: ${{ secrets.NAJIM_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.NAJIM_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NAJIM_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NAJIM_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$STORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo 'Missing release signing secrets. No release APK will be published.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$STORE_B64" | base64 --decode > "$RUNNER_TEMP/najim-release.jks"
          test -s "$RUNNER_TEMP/najim-release.jks"

      - name: Build signed, minified release
        shell: bash
        env:
          NAJIM_RELEASE_STORE_FILE: ${{ runner.temp }}/najim-release.jks
          NAJIM_RELEASE_STORE_PASSWORD: ${{ secrets.NAJIM_RELEASE_STORE_PASSWORD }}
          NAJIM_RELEASE_KEY_ALIAS: ${{ secrets.NAJIM_RELEASE_KEY_ALIAS }}
          NAJIM_RELEASE_KEY_PASSWORD: ${{ secrets.NAJIM_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify release signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          sha256sum "$apk" | tee "$RUNNER_TEMP/najim-release.sha256"
          printf 'Commit: %s\n' "$GITHUB_SHA"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: najimwifi-signed-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: najimwifi-release-checksum-${{ github.run_number }}
          path: ${{ runner.temp }}/najim-release.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: najimwifi-release-test-results-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Erase temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/najim-release.jks"
